<text x="40" y="43" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#286587">INERTIA / OCTOBER 30 DEMO</text>
<text x="40" y="92" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#21374a">A useful five-minute walkthrough</text>
<text x="40" y="126" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475b6c">Use existing artifacts and a harmless organization question. If a step is unavailable, show dated evidence; do not run repair commands during the</text>
<text x="40" y="150.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475b6c">demo.</text>
<rect x="40" y="170" width="1120" height="94" rx="12" fill="#ffffff" stroke="#dae2e9"/>
<text x="60" y="199" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#21374a">1 / Purpose + architecture - 30 sec</text>
<text x="60" y="227" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475b6c">Show the big-picture view. Explain the general Coordinator, native work, separate case owners and independent review.</text>
<rect x="40" y="279" width="1120" height="94" rx="12" fill="#ffffff" stroke="#dae2e9"/>
<text x="60" y="308" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#21374a">2 / Existing knowledge - 60 sec</text>
<text x="60" y="336" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475b6c">Ask the known DATACU-style question in /work. Show sources. State that funding machine-reader wiring is still missing.</text>
<rect x="40" y="388" width="1120" height="94" rx="12" fill="#ffffff" stroke="#dae2e9"/>
<text x="60" y="417" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#21374a">3 / Discovery handoff - 60 sec</text>
<text x="60" y="445" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475b6c">Open the retained13-binding Alpha -&gt; Coordinator queue. Explain the capacity blocker; do not pretend case fanout succeeded.</text>
<rect x="40" y="497" width="1120" height="94" rx="12" fill="#ffffff" stroke="#dae2e9"/>
<text x="60" y="526" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#21374a">4 / Critique and correction - 60 sec</text>
<text x="60" y="554" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475b6c">Show the retained independent rejection and same-case Beta continuation. Rejection demonstrates quality control, not accepted application</text>
<text x="60" y="578.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475b6c">content.</text>
<rect x="40" y="606" width="1120" height="94" rx="12" fill="#ffffff" stroke="#dae2e9"/>
<text x="60" y="635" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#21374a">5 / Actual generated output - 60 sec</text>
<text x="60" y="663" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475b6c">Show the eight-field brief and available render. Call it a pursuit brief; narrative, project, budget and final packet remain unfinished.</text>
<rect x="40" y="715" width="1120" height="94" rx="12" fill="#ffffff" stroke="#dae2e9"/>
<text x="60" y="744" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#21374a">6 / Next useful outcome - 30 sec</text>
<text x="60" y="772" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475b6c">Normal execution, retained portfolio fanout and reviewed application material. Connect existing corpus/notes through owning interfaces.</text>
<text x="40" y="868" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#21374a">Snapshot: 29 Oct 2026, 16:22:18 CDT operator proof. Static document; refresh before presenting.</text>
