<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inertia preprod and production architecture</title><style>body{margin:0;background:#f7f8fa;color:#17333d;font:16px Arial,sans-serif}main{max-width:1280px;margin:auto;padding:20px}nav{display:flex;gap:12px;margin-bottom:18px;position:sticky;top:0;background:#f7f8fa;padding:14px 0}button,a{font:inherit;border:1px solid #b8cbd1;padding:10px 18px;background:white;border-radius:8px;color:#17333d;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#17333d;color:white}img{width:100%;height:auto}a{margin-left:auto}@media print{nav{display:none}}</style></head><body><main><nav><a href="delivery-overview.html" style="margin-left:0">Mission & delivery map</a><button data-view="preprod" aria-pressed="true">Preprod</button><button data-view="prod" aria-pressed="false">Production target</button><a id="source" href="inertia-preprod.svg">Open full diagram</a></nav><img id="diagram" src="inertia-preprod.svg" alt="Inertia preproduction architecture"><script>const diagram=document.getElementById('diagram'),source=document.getElementById('source');document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));diagram.src='inertia-'+b.dataset.view+'.svg';diagram.alt='Inertia '+b.dataset.view+' architecture';source.href=diagram.src}));</script></main></body></html>
