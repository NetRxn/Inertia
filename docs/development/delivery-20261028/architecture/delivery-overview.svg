<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1720" viewBox="0 0 1440 1720" role="img" aria-labelledby="title desc"><title id="title">Inertia mission and delivery map</title><desc id="desc">General Coordinator oversees funding, Buzz and meeting work. Alpha discovers, parallel Beta owners prepare, Charlie reviews and returns corrections. Human authorization, submission execution and outcome evidence are separate. Paperclip controls lifecycle; DFW owns funding logic. Local qualification precedes one-plane VPS cutover.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6a818e"/></marker></defs><rect width="1440" height="1720" fill="#f7f9fb"/><g font-family="Arial,Helvetica,sans-serif">
