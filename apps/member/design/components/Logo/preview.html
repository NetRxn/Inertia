<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Logo — preview</title>
<style>

  .realm { display: grid; justify-items: center; gap: var(--space-2); }
  .realm span { font: 500 11px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }

  [data-theme="day"] .day { display: inline; }
  [data-theme="day"] .night { display: none; }

<body>
<div class="sheet in-tex in-tex--stars">
  <div class="row">
    <img class="night" src="../../assets/Logos/inertia-lockup-on-dark.svg" alt="Inertia" height="56">
    <img class="day" src="../../assets/Logos/inertia-lockup-on-light.svg" alt="Inertia" height="56">
    <img class="night" src="../../assets/Logos/inertia-mark-on-dark.svg" alt="" height="72">
    <img class="day" src="../../assets/Logos/inertia-mark-on-light.svg" alt="" height="72">
  </div>
  <div class="row">
    <div class="realm"><img class="night" src="../../assets/Logos/inertia-realm-people-on-dark.svg" alt="" height="64"><img class="day" src="../../assets/Logos/inertia-realm-people-on-light.svg" alt="" height="64"><span>People</span></div>
    <div class="realm"><img class="night" src="../../assets/Logos/inertia-realm-agent-on-dark.svg" alt="" height="64"><img class="day" src="../../assets/Logos/inertia-realm-agent-on-light.svg" alt="" height="64"><span>Agent</span></div>
    <div class="realm"><img class="night" src="../../assets/Logos/inertia-realm-org-on-dark.svg" alt="" height="64"><img class="day" src="../../assets/Logos/inertia-realm-org-on-light.svg" alt="" height="64"><span>Organization</span></div>
  </div>
</div>
