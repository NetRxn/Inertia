<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IdeaCard — preview</title>
<style>
  .board { position: relative; display: flex; flex-wrap: wrap; gap: var(--space-6); padding: var(--space-6); align-items: flex-start; overflow: hidden; }
  .light { position: absolute; border-radius: var(--radius-pill); filter: blur(40px); opacity: .3; background: var(--pollen); width: 200px; height: 160px; left: 240px; top: 60px; }
  .in-idea { position: relative; }
</style></head>
<body>
<div class="board">
  <div class="light"></div>
  <article class="in-idea in-tex in-tex--weave">
    <div class="in-idea__src"><span class="in-mono">telegram · #events</span><span class="in-chip in-chip--pollen">New</span></div>
    <span class="in-prairie" aria-hidden="true"></span>
    <p class="in-idea__text">Host the next build night at the library — more people can find it.</p>
    <div class="in-idea__meta"><span><span class="in-avatar">DL</span>Dana · 2d</span><span class="in-chip in-chip--moss">+4</span></div>
  </article>
  <article class="in-idea in-tex in-tex--weave">
    <div class="in-idea__src"><span class="in-mono">meet · wed notes</span><span class="in-chip in-chip--tide">Needs confirm</span></div>
    <span class="in-prairie" aria-hidden="true"></span>
    <p class="in-idea__text">What if grant drafts went to the whole guild before the vote?</p>
    <div class="in-idea__meta"><span><span class="in-avatar">MR</span>Marco · 4h</span><span class="in-chip in-chip--moss">+1</span></div>
  </article>
</div>
<script></script>
</body>
</html>
